name: Build, Push and Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build the image
        run: docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/taskboard-backend:latest" .

      - name: Push the image
        run: docker push "${{ secrets.DOCKERHUB_USERNAME }}/taskboard-backend:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and restart on EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/taskboard-backend:latest
            docker stop taskboard-backend || true
            docker rm taskboard-backend || true
            docker run -d \
              --name taskboard-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/taskboard-backend/.env \
              -p 5000:5000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/taskboard-backend:latest
            docker image prune -f
          EOF
